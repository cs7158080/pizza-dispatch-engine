# No named volumes: postgres and rabbitmq write to their own container filesystems, so
# `docker compose down` leaves nothing behind and the next `up` starts empty. This is
# deliberate — every launch starts from a known state, which is what the suite that runs
# at startup depends on. A volume per service is what would make the data survive.

services:
  postgres:
    image: postgres:16
    attach: false
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pizza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pizza}
      POSTGRES_DB: ${POSTGRES_DB:-pizza}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13
    attach: false
    restart: on-failure
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pizza}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pizza}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  schema:
    build:
      context: .
      target: runtime
    image: pizza-runtime
    command: ["python", "-m", "pizza.entrypoints.schema.main"]
    # This service reads database_url alone; the rest are supplied because
    # ServiceSettings requires every field to be present.
    environment:
      PIZZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pizza}:${POSTGRES_PASSWORD:-pizza}@postgres:5432/${POSTGRES_DB:-pizza}
      PIZZA_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-pizza}:${RABBITMQ_DEFAULT_PASS:-pizza}@rabbitmq:5672/
      PIZZA_LOG_LEVEL: ${PIZZA_LOG_LEVEL:-INFO}
      PIZZA_BROKER_PUBLISH_TIMEOUT_SECONDS: ${PIZZA_BROKER_PUBLISH_TIMEOUT_SECONDS:-5}
      PIZZA_DISPATCH_RETRY_DELAY_SECONDS: ${PIZZA_DISPATCH_RETRY_DELAY_SECONDS:-8}
      PIZZA_DISPATCH_MAX_RETRIES: ${PIZZA_DISPATCH_MAX_RETRIES:-8}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    image: pizza-runtime
    command: ["uvicorn", "pizza.entrypoints.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: on-failure
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      PIZZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pizza}:${POSTGRES_PASSWORD:-pizza}@postgres:5432/${POSTGRES_DB:-pizza}
      PIZZA_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-pizza}:${RABBITMQ_DEFAULT_PASS:-pizza}@rabbitmq:5672/
      PIZZA_LOG_LEVEL: ${PIZZA_LOG_LEVEL:-INFO}
      PIZZA_BROKER_PUBLISH_TIMEOUT_SECONDS: ${PIZZA_BROKER_PUBLISH_TIMEOUT_SECONDS:-5}
      PIZZA_DISPATCH_RETRY_DELAY_SECONDS: ${PIZZA_DISPATCH_RETRY_DELAY_SECONDS:-8}
      PIZZA_DISPATCH_MAX_RETRIES: ${PIZZA_DISPATCH_MAX_RETRIES:-8}
    depends_on:
      schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      target: runtime
    image: pizza-runtime
    command: ["python", "-m", "pizza.entrypoints.worker.main"]
    restart: on-failure
    environment:
      PIZZA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pizza}:${POSTGRES_PASSWORD:-pizza}@postgres:5432/${POSTGRES_DB:-pizza}
      PIZZA_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-pizza}:${RABBITMQ_DEFAULT_PASS:-pizza}@rabbitmq:5672/
      PIZZA_LOG_LEVEL: ${PIZZA_LOG_LEVEL:-INFO}
      PIZZA_BROKER_PUBLISH_TIMEOUT_SECONDS: ${PIZZA_BROKER_PUBLISH_TIMEOUT_SECONDS:-5}
      PIZZA_DISPATCH_RETRY_DELAY_SECONDS: ${PIZZA_DISPATCH_RETRY_DELAY_SECONDS:-8}
      PIZZA_DISPATCH_MAX_RETRIES: ${PIZZA_DISPATCH_MAX_RETRIES:-8}
    depends_on:
      schema:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Runs once at launch and exits, leaving the rest of the stack up. No restart key:
  # a restart would re-run the suite indefinitely, and the CI gate in README.md
  # reads the exit of a container that is expected to stay exited.
  tests:
    build:
      context: .
      target: test
    image: pizza-test
    command: ["pytest", "tests/integration", "-v", "-ra", "--durations=0", "--tb=short"]
    environment:
      PIZZA_API_BASE_URL: ${PIZZA_API_BASE_URL:-http://api:8000}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  # Not started by `up`: an interactive prompt loop with no terminal reads EOF and
  # exits. Run it with `docker compose run --rm cli`, which attaches a terminal.
  cli:
    build:
      context: .
      target: runtime
    image: pizza-runtime
    command: ["python", "-m", "pizza.entrypoints.cli.main"]
    profiles: ["cli"]
    environment:
      PIZZA_API_BASE_URL: ${PIZZA_API_BASE_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
