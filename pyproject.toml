[project]
name = "pizza"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pika",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.mypy]
strict = true
