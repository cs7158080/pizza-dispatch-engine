[project]
name = "pizza"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pika",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "TID251"]

# Layering rule: the business core imports no third-party library.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy".msg = "infrastructure only"
"pika".msg = "infrastructure only"
"fastapi".msg = "infrastructure only"
"pydantic".msg = "config.py and entrypoints only"

[tool.ruff.lint.per-file-ignores]
"src/pizza/infrastructure/*" = ["TID251"]
"src/pizza/entrypoints/*" = ["TID251"]
"src/pizza/config.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
strict = true

# pika ships no type information, so strict mode cannot analyse it.
[[tool.mypy.overrides]]
module = ["pika.*"]
ignore_missing_imports = true
